<!DOCTYPE html>
<html lang="en">

<!--
    Generated by scripts/build-blog.js from the content and templates in blog/.
    Do not edit this file: change those, then run `npm run build:blog`.
-->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{pageTitle}}</title>
    <meta name="description" content="{{description}}">
    <meta name="author" content="Harsh Ankur">
    <link rel="canonical" href="{{address}}">
    <link rel="alternate" type="application/rss+xml" title="officeParser Blog" href="./feed.xml">
    <link rel="icon" type="image/png" href="../favicon.png">

    <!-- Open Graph -->
    <meta property="og:title" content="{{shareTitle}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:type" content="{{shareType}}">
    <meta property="og:url" content="{{address}}">
    <meta property="og:site_name" content="officeParser">
{{#published}}
    <meta property="article:published_time" content="{{published}}">
{{/published}}
{{#updated}}
    <meta property="article:modified_time" content="{{updated}}">
{{/updated}}

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./blog.css">
    <!-- In the head and not deferred: it sets the theme before the page is first painted. -->
    <script src="./blog.js"></script>
</head>

<body>
    <header class="blog-header">
        <div class="header-container">
            <div class="logo-group">
                <a href="../" class="brand-logo">
                    <span>officeParser</span>
                    <span class="brand-badge">Blog</span>
                </a>
            </div>
            <nav class="nav-actions" aria-label="Site">
{{#isPost}}
                <a href="./" class="nav-link"><span class="nav-long">All Articles</span><span
                        class="nav-short">Articles</span></a>
{{/isPost}}
                <a href="../" class="nav-link"><span class="nav-long">Visualizer &amp; Docs</span><span
                        class="nav-short">Docs</span></a>
                <a href="https://github.com/harshankur/officeParser" class="nav-link nav-secondary" target="_blank"
                    rel="noopener">GitHub</a>
                <button class="theme-toggle-btn" id="theme-toggle" type="button" aria-label="Toggle theme">
                    <span id="theme-icon" aria-hidden="true">🌙</span>
                </button>
            </nav>
        </div>
    </header>

    <main>
{{{main}}}
    </main>

    <footer class="blog-footer">
        <div class="footer-inner">
            <div>
                <strong>officeParser</strong> · Document parsing and generation for Node.js and the browser.
            </div>
            <div class="footer-links">
                <a href="../">Visualizer</a>
                <a href="../#spec/converter">API Reference</a>
                <a href="https://github.com/harshankur/officeParser" target="_blank" rel="noopener">GitHub</a>
                <a href="./feed.xml">RSS</a>
            </div>
        </div>
    </footer>
</body>

</html>
